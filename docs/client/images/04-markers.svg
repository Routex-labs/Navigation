<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="840" height="360" fill="#ffffff"/>

  <!-- ===== 4-a 도착 핀 ===== -->
  <text x="24" y="28" font-size="13" font-weight="700" fill="#57606A">4-a. 도착 핀 — 빨간 원 + 흰 글씨 + 흰 아웃라인</text>

  <g transform="translate(24 44)">
    <rect x="0" y="0" width="404" height="152" rx="12" fill="#F6F8FA" stroke="#E1E4E8"/>

    <!-- 야외 (현재) -->
    <text x="62" y="26" font-size="10.5" font-weight="700" fill="#CF222E" text-anchor="middle">야외 (현재)</text>
    <g transform="translate(62 74)">
      <circle cx="0" cy="0" r="20" fill="#E53935"/>
      <path d="M0 34 L7.6 15 L-7.6 15 Z" fill="#E53935"/>
    </g>
    <text x="62" y="132" font-size="9.5" fill="#CF222E" text-anchor="middle">단색 — 정보 없음</text>

    <!-- 실내 (현재) -->
    <text x="176" y="26" font-size="10.5" font-weight="700" fill="#CF222E" text-anchor="middle">실내 (현재)</text>
    <g transform="translate(176 74)">
      <circle cx="0" cy="0" r="20" fill="#E53935"/>
      <path d="M0 34 L7.6 15 L-7.6 15 Z" fill="#E53935"/>
      <circle cx="0" cy="0" r="14" fill="#fff"/>
      <text x="0" y="4" font-size="9.5" font-weight="700" fill="#1E2033" text-anchor="middle">도착</text>
    </g>
    <text x="176" y="132" font-size="9.5" fill="#CF222E" text-anchor="middle">속이 비어 색 면적이 작다</text>

    <!-- 화살표 -->
    <path d="M238 74 L264 74 M257 68 L264 74 L257 80" stroke="#8C959F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 변경 후 -->
    <text x="330" y="26" font-size="10.5" font-weight="700" fill="#1A7F37" text-anchor="middle">변경 후</text>
    <g transform="translate(330 74)">
      <path d="M0 34 L7.6 15 A20 20 0 1 0 -7.6 15 Z" fill="#E53935" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/>
      <text x="0" y="4" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">도착</text>
    </g>
    <text x="330" y="132" font-size="9.5" fill="#1A7F37" text-anchor="middle">빨강 채움 · 흰 글씨 · 아웃라인</text>
  </g>

  <text x="24" y="216" font-size="10.5" fill="#57606A">네이버·카카오 모두 같은 규칙이다 — 바탕은 빨강으로 채우고,</text>
  <text x="24" y="234" font-size="10.5" fill="#57606A">글씨는 흰색으로 안에 넣고, 실루엣 전체에 흰 아웃라인을 두른다.</text>
  <text x="24" y="252" font-size="10.5" fill="#57606A">흰 배경 도면 위에서 마커 경계를 살리는 건 이 아웃라인이다.</text>

  <!-- ===== 4-c 시설 라벨 ===== -->
  <text x="456" y="28" font-size="13" font-weight="700" fill="#57606A">4-c. 시설물 텍스트 라벨 제거</text>

  <g transform="translate(456 44)">
    <rect x="0" y="0" width="360" height="152" rx="12" fill="#F6F8FA" stroke="#E1E4E8"/>

    <text x="14" y="24" font-size="10" font-weight="700" fill="#CF222E">현재 — 에스컬레이터 152 · 엘리베이터 68</text>
    <g transform="translate(14 34)">
      <g>
        <circle cx="12" cy="12" r="11" fill="#7EA96F"/>
        <path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <text x="30" y="16" font-size="10" fill="#4F5451">에스컬레이터</text>
      </g>
      <g transform="translate(0 26)">
        <circle cx="12" cy="12" r="11" fill="#7EA96F"/>
        <path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <text x="30" y="16" font-size="10" fill="#4F5451">에스컬레이터</text>
      </g>
      <g transform="translate(0 52)">
        <circle cx="12" cy="12" r="11" fill="#7EA96F"/>
        <path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <text x="30" y="16" font-size="10" fill="#4F5451">에스컬레이터</text>
      </g>
      <g transform="translate(0 78)">
        <circle cx="12" cy="12" r="11" fill="#7EA96F"/>
        <path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <text x="30" y="16" font-size="10" fill="#4F5451">에스컬레이터</text>
      </g>
    </g>

    <path d="M170 78 L198 78 M191 72 L198 78 L191 84" stroke="#8C959F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="222" y="24" font-size="10" font-weight="700" fill="#1A7F37">아이콘만</text>
    <g transform="translate(232 34)">
      <g><circle cx="12" cy="12" r="11" fill="#7EA96F"/><path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
      <g transform="translate(0 26)"><circle cx="12" cy="12" r="11" fill="#7EA96F"/><path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
      <g transform="translate(0 52)"><circle cx="12" cy="12" r="11" fill="#7EA96F"/><path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
      <g transform="translate(0 78)"><circle cx="12" cy="12" r="11" fill="#7EA96F"/><path d="M7 15 l4 -5 h4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
    </g>
    <text x="276" y="56" font-size="9.5" fill="#1A7F37">아이콘이 이미</text>
    <text x="276" y="72" font-size="9.5" fill="#1A7F37">무슨 시설인지</text>
    <text x="276" y="88" font-size="9.5" fill="#1A7F37">말한다</text>
  </g>

  <text x="456" y="216" font-size="10.5" fill="#57606A">도면이 &quot;에스컬레이터&quot;로 도배되어 정작 읽어야 할 매장명이 묻힌다.</text>
  <text x="456" y="234" font-size="10.5" fill="#57606A">구글·네이버도 에스컬레이터에 텍스트를 붙이지 않는다.</text>

  <!-- ===== 경고 박스 ===== -->
  <g transform="translate(24 276)">
    <rect x="0" y="0" width="792" height="52" rx="10" fill="#FFF8E5" stroke="#D4A72C" stroke-opacity="0.5"/>
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#7D4E00">4-b. 시설 아이콘 크기 — 과거 피드백을 뒤집는 변경</text>
    <text x="16" y="40" font-size="11" fill="#7D4E00">z20 최대값 0.6 → 0.45로 낮춘다. 단, &quot;잘 안 보인다&quot;는 과거 피드백에 맞춰 키운 값이므로 <tspan font-weight="700">z16 줌아웃 상태를 반드시 같이 확인</tspan>한다. 최소값 0.33은 유지.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 316" width="840" height="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="840" height="316" fill="#ffffff"/>

  <text x="24" y="28" font-size="13" font-weight="700" fill="#57606A">5. 매장 라벨 — 카테고리 아이콘 + 카테고리 색</text>

  <!-- 변경 전 -->
  <g transform="translate(24 60)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#CF222E">변경 전 — 전부 #333333</text>
    <rect x="0" y="12" width="300" height="164" rx="8" fill="#EAE6E1" stroke="#CFC9C2"/>
    <g font-size="11" fill="#333333">
      <text x="24" y="42">스타벅스 리저브</text>
      <text x="24" y="70">노스페이스</text>
      <text x="24" y="98">올리브영</text>
      <text x="24" y="126">시스템</text>
      <text x="24" y="154">토이저러스</text>
    </g>
    <text x="180" y="98" font-size="10" fill="#CF222E" text-anchor="middle">이름을 다 읽어야</text>
    <text x="180" y="114" font-size="10" fill="#CF222E" text-anchor="middle">종류를 안다</text>
  </g>

  <!-- 화살표 -->
  <g transform="translate(352 138)">
    <path d="M0 8 L34 8 M26 2 L34 8 L26 14" stroke="#8C959F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 변경 후 -->
  <g transform="translate(410 60)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#1A7F37">변경 후 — 색만으로 종류가 읽힌다</text>
    <rect x="0" y="12" width="406" height="164" rx="8" fill="#EAE6E1" stroke="#CFC9C2"/>

    <!-- 식음료 -->
    <circle cx="34" cy="38" r="9" fill="#fff" stroke="#F57C00" stroke-width="1.4"/>
    <path d="M30 35 h7 v4 a3.5 3.5 0 0 1 -7 0 z M37 36 h2 a1.8 1.8 0 0 1 0 3.6 h-2" stroke="#F57C00" stroke-width="1.1" fill="none"/>
    <text x="50" y="42" font-size="11" font-weight="600" fill="#F57C00">스타벅스 리저브</text>

    <!-- 패션 -->
    <circle cx="34" cy="66" r="9" fill="#fff" stroke="#7E57C2" stroke-width="1.4"/>
    <path d="M34 62 a2 2 0 1 1 0.1 0 M34 64 v2 l-5 3.5 h10 z" stroke="#7E57C2" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
    <text x="50" y="70" font-size="11" font-weight="600" fill="#7E57C2">노스페이스</text>

    <!-- 뷰티 -->
    <circle cx="34" cy="94" r="9" fill="#fff" stroke="#E53935" stroke-width="1.4"/>
    <path d="M30 98 l6 -6 3 3 -6 6 z" stroke="#E53935" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
    <text x="50" y="98" font-size="11" font-weight="600" fill="#E53935">올리브영</text>

    <!-- 패션 -->
    <circle cx="34" cy="122" r="9" fill="#fff" stroke="#7E57C2" stroke-width="1.4"/>
    <path d="M34 118 a2 2 0 1 1 0.1 0 M34 120 v2 l-5 3.5 h10 z" stroke="#7E57C2" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
    <text x="50" y="126" font-size="11" font-weight="600" fill="#7E57C2">시스템</text>

    <!-- 키즈 -->
    <circle cx="34" cy="150" r="9" fill="#fff" stroke="#EC407A" stroke-width="1.4"/>
    <circle cx="34" cy="150" r="4" stroke="#EC407A" stroke-width="1.1" fill="none"/>
    <text x="50" y="154" font-size="11" font-weight="600" fill="#EC407A">토이저러스</text>

    <!-- 범례 -->
    <g transform="translate(240 34)" font-size="9.5" fill="#57606A">
      <rect x="0" y="-8" width="10" height="10" rx="2" fill="#7E57C2"/><text x="16" y="1">패션</text>
      <rect x="0" y="12" width="10" height="10" rx="2" fill="#F57C00"/><text x="16" y="21">식음료</text>
      <rect x="0" y="32" width="10" height="10" rx="2" fill="#00897B"/><text x="16" y="41">리빙</text>
      <rect x="0" y="52" width="10" height="10" rx="2" fill="#E53935"/><text x="16" y="61">뷰티</text>
      <rect x="88" y="-8" width="10" height="10" rx="2" fill="#3F51B5"/><text x="104" y="1">서비스</text>
      <rect x="88" y="12" width="10" height="10" rx="2" fill="#EC407A"/><text x="104" y="21">키즈</text>
      <rect x="88" y="32" width="10" height="10" rx="2" fill="#607D8B"/><text x="104" y="41">편의시설</text>
    </g>
  </g>

  <!-- 차단 요인 -->
  <g transform="translate(24 250)">
    <rect x="0" y="0" width="792" height="52" rx="10" fill="#FFEBE9" stroke="#CF222E" stroke-opacity="0.4"/>
    <text x="16" y="21" font-size="11.5" font-weight="700" fill="#A40E26">차단 요인 — 백엔드 선행 작업이 필수다</text>
    <text x="16" y="40" font-size="11" fill="#A40E26">타일 stores properties가 <tspan font-family="ui-monospace, Menlo, monospace">{id, name, kind}</tspan>뿐이라 <tspan font-family="ui-monospace, Menlo, monospace">['get','category']</tspan>를 쓸 수 없다. <tspan font-weight="700">tiling.py에 category 추가 + 타일 캐시 무효화가 먼저다.</tspan></text>
  </g>
</svg>

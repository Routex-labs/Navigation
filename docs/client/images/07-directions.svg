<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 356" width="840" height="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="840" height="356" fill="#ffffff"/>

  <text x="24" y="28" font-size="13" font-weight="700" fill="#57606A">7. 길찾기 입력 — 같은 기능이 두 군데에 있다</text>

  <!-- 현재 -->
  <g transform="translate(24 60)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#CF222E">현재</text>
    <rect x="0" y="12" width="230" height="250" rx="14" fill="#F6F8FA" stroke="#E1E4E8"/>

    <!-- 상단 draft 바 -->
    <rect x="14" y="26" width="202" height="56" rx="14" fill="#fff" stroke="#D0D7DE"/>
    <text x="28" y="48" font-size="10.5" fill="#242424">◎ 현재 위치</text>
    <line x1="28" y1="56" x2="204" y2="56" stroke="#E1E4E8"/>
    <text x="28" y="74" font-size="10.5" fill="#242424">◉ 도착지</text>
    <text x="30" y="98" font-size="9.5" fill="#57606A">draft 표시만</text>

    <!-- 지도 영역 -->
    <rect x="14" y="106" width="202" height="52" fill="#EAE6E1" stroke="#CFC9C2"/>
    <text x="115" y="136" font-size="10" fill="#8C959F" text-anchor="middle">지도</text>

    <!-- 키보드에 밀린 하단 시트 -->
    <rect x="14" y="164" width="202" height="46" rx="12" fill="#fff" stroke="#CF222E"/>
    <text x="28" y="184" font-size="10.5" font-weight="700" fill="#242424">길찾기</text>
    <rect x="28" y="192" width="174" height="12" rx="6" fill="#EEF4FE"/>
    <text x="30" y="226" font-size="9.5" fill="#CF222E">실제 입력은 하단 시트</text>

    <!-- 키보드 -->
    <rect x="14" y="214" width="202" height="34" rx="6" fill="#D0D7DE"/>
    <text x="115" y="236" font-size="10" fill="#57606A" text-anchor="middle">키보드</text>
  </g>

  <text x="24" y="336" font-size="11" fill="#CF222E">키보드가 아래에서 올라와 지도를 덮는다 → resizeToAvoidBottomInset: false + 높이 수동 계산이 따라다닌다.</text>

  <!-- 화살표 -->
  <g transform="translate(276 176)">
    <path d="M0 8 L34 8 M26 2 L34 8 L26 14" stroke="#8C959F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 변경 후 -->
  <g transform="translate(334 60)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#1A7F37">변경 후 — 상단 확장 패널</text>
    <rect x="0" y="12" width="230" height="250" rx="14" fill="#F6F8FA" stroke="#1A7F37" stroke-opacity="0.35"/>

    <rect x="14" y="26" width="202" height="56" rx="14" fill="#fff" stroke="#4A87F1"/>
    <text x="28" y="48" font-size="10.5" fill="#242424">◎ 현재 위치</text>
    <line x1="28" y1="56" x2="204" y2="56" stroke="#E1E4E8"/>
    <text x="28" y="74" font-size="10.5" fill="#242424">◉ 도착지를 입력하세요</text>

    <!-- 펼쳐진 패널 -->
    <rect x="14" y="86" width="202" height="96" rx="12" fill="#fff" stroke="#D0D7DE"/>
    <text x="28" y="104" font-size="9.5" fill="#57606A">최근 · 즐겨찾기 · 검색 결과</text>
    <line x1="28" y1="112" x2="204" y2="112" stroke="#F0F2F4"/>
    <text x="28" y="128" font-size="10" fill="#242424">스타벅스 리저브</text>
    <line x1="28" y1="136" x2="204" y2="136" stroke="#F0F2F4"/>
    <text x="28" y="152" font-size="10" fill="#242424">지도에서 선택</text>
    <line x1="28" y1="160" x2="204" y2="160" stroke="#F0F2F4"/>
    <text x="28" y="176" font-size="10" fill="#242424">전체 층에서 찾기</text>

    <!-- 지도 -->
    <rect x="14" y="188" width="202" height="26" fill="#EAE6E1" stroke="#CFC9C2"/>

    <!-- 키보드 -->
    <rect x="14" y="218" width="202" height="30" rx="6" fill="#D0D7DE"/>
    <text x="115" y="238" font-size="10" fill="#57606A" text-anchor="middle">키보드</text>
  </g>

  <!-- 상용 비교 -->
  <g transform="translate(600 72)">
    <rect x="0" y="0" width="216" height="206" rx="12" fill="#F6F8FA" stroke="#E1E4E8"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="#57606A">상용 지도의 공통점</text>
    <text x="16" y="48" font-size="10.5" fill="#24292F">구글 · 애플</text>
    <text x="16" y="64" font-size="10" fill="#57606A">입력 = 상단, 하단은 결과·옵션만</text>
    <line x1="16" y1="76" x2="200" y2="76" stroke="#E1E4E8"/>
    <text x="16" y="94" font-size="10.5" fill="#24292F">네이버 · 카카오</text>
    <text x="16" y="110" font-size="10" fill="#57606A">상단 고정 전용 입력 화면</text>
    <line x1="16" y1="122" x2="200" y2="122" stroke="#E1E4E8"/>
    <text x="16" y="142" font-size="10.5" font-weight="700" fill="#1A7F37">입력 필드는 예외 없이 위에 있다</text>
    <text x="16" y="162" font-size="10" fill="#57606A">우연이 아니라 키보드가 아래에서</text>
    <text x="16" y="177" font-size="10" fill="#57606A">올라오기 때문이다.</text>
    <text x="16" y="196" font-size="9.5" fill="#7D4E00">⚠ 시트 chain 재배선 — 범위 큼</text>
  </g>
</svg>

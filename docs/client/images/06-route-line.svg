<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 348" width="840" height="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="840" height="348" fill="#ffffff"/>

  <text x="24" y="28" font-size="13" font-weight="700" fill="#57606A">6. 경로선 — 흰 도면 위의 흰 casing은 보이지 않는다</text>

  <!-- 변경 전 -->
  <g transform="translate(24 60)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#CF222E">변경 전</text>
    <rect x="0" y="12" width="360" height="150" fill="#FFFFFF" stroke="#D0D7DE"/>
    <!-- 흰 casing (안 보임) -->
    <path d="M40 130 L40 70 L150 70 L150 40 L320 40" stroke="#FFFFFF" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 130 L40 70 L150 70 L150 40 L320 40" stroke="#4A87F1" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="106" font-size="10.5" fill="#CF222E">흰 casing 8px → 흰 배경에서 무의미</text>
    <text x="180" y="124" font-size="10.5" fill="#CF222E">방향을 알 수 없음</text>
  </g>

  <!-- 화살표 -->
  <g transform="translate(400 128)">
    <path d="M0 8 L34 8 M26 2 L34 8 L26 14" stroke="#8C959F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 변경 후 -->
  <g transform="translate(456 60)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#1A7F37">변경 후 — 네이버·카카오 방식</text>
    <rect x="0" y="12" width="360" height="150" fill="#FFFFFF" stroke="#D0D7DE"/>
    <!-- 진한 파랑 아웃라인 -->
    <path d="M40 130 L40 70 L150 70 L150 40 L320 40" stroke="#1B57C4" stroke-width="17" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 130 L40 70 L150 70 L150 40 L320 40" stroke="#4A87F1" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 흰 chevron -->
    <g stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 118 L40 112 L44 118"/>
      <path d="M36 100 L40 94 L44 100"/>
      <path d="M36 82 L40 76 L44 82"/>
      <path d="M74 66 L80 70 L74 74"/>
      <path d="M104 66 L110 70 L104 74"/>
      <path d="M134 66 L140 70 L134 74"/>
      <path d="M146 58 L150 52 L154 58"/>
      <path d="M184 36 L190 40 L184 44"/>
      <path d="M224 36 L230 40 L224 44"/>
      <path d="M264 36 L270 40 L264 44"/>
      <path d="M304 36 L310 40 L304 44"/>
    </g>
    <text x="180" y="106" font-size="10.5" fill="#1A7F37">진한 파랑 아웃라인 9px + 흰 chevron</text>
    <text x="180" y="124" font-size="10.5" fill="#1A7F37">방향이 시각적으로 확정된다</text>
  </g>

  <!-- 두 구현 비교 -->
  <g transform="translate(24 236)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#57606A">지금은 구현이 두 개고 서로 다르다</text>
    <g font-size="10.5">
      <rect x="0" y="10" width="792" height="24" fill="#F6F8FA"/>
      <text x="12" y="26" fill="#57606A" font-weight="700">파일</text>
      <text x="240" y="26" fill="#57606A" font-weight="700">casing</text>
      <text x="400" y="26" fill="#57606A" font-weight="700">본선</text>
      <text x="620" y="26" fill="#57606A" font-weight="700">지나온 구간</text>

      <text x="12" y="52" fill="#24292F" font-family="ui-monospace, Menlo, monospace">outdoor_map_screen.dart</text>
      <text x="240" y="52" fill="#CF222E">흰색 8px</text>
      <text x="400" y="52" fill="#24292F">primary 5px, opacity 1</text>
      <text x="620" y="52" fill="#CF222E">없음</text>

      <line x1="0" y1="62" x2="792" y2="62" stroke="#E1E4E8"/>

      <text x="12" y="78" fill="#24292F" font-family="ui-monospace, Menlo, monospace">floor_plan_view.dart</text>
      <text x="240" y="78" fill="#CF222E">없음</text>
      <text x="400" y="78" fill="#CF222E">#1A73E8 5px, opacity 0.6</text>
      <text x="620" y="78" fill="#1A7F37">있음 (#9AA0A6)</text>
    </g>
    <text x="0" y="98" font-size="10.5" fill="#7D4E00">⚠ 층 전환 구간(점선)에는 화살표를 붙이지 않는다 — 수평 이동이 아니라 층 이동이라 방향의 의미가 다르다.</text>
  </g>
</svg>

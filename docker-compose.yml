services:
  backend:
    build:
      context: ./backend
    image: navigation/backend:0.1.0
    ports:
      - "8001:8001"
    environment:
      NAV_DATABASE_URL: sqlite:////app/data/navigation.db
      NAV_LOG_LEVEL: ${NAV_LOG_LEVEL:-INFO}
    # 서버만 실행한다. 시드는 아래 seed 서비스로 분리했다 — 재시작이 DB를 초기화하지
    # 않게 하기 위함이다. DB는 named volume(nav-data)에 남으므로 재시작해도 유지된다.
    command: >
      sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port 8001"
    volumes:
      - nav-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1회성 시드 잡. 기본 `up`에는 뜨지 않고(profiles), 명시적으로 실행할 때만 돈다:
  #   docker compose run --rm seed
  # backend와 같은 nav-data 볼륨을 공유하므로, 한 번 시드하면 backend가 그 DB를 읽는다.
  seed:
    build:
      context: ./backend
    image: navigation/backend:0.1.0
    profiles:
      - seed
    environment:
      NAV_DATABASE_URL: sqlite:////app/data/navigation.db
    command: python -m scripts.seed.reset_and_seed
    volumes:
      - nav-data:/app/data

volumes:
  nav-data:

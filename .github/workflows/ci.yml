name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test tests/unit_test/
      - run: xvfb-run -a flutter test tests/integration_test/ -d linux

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - run: pip install -r requirements.txt -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check

      - name: Format (ruff)
        run: ruff format --check

      - name: Type check (mypy)
        run: mypy

      # 경로를 나열하지 않는다 — pyproject.toml의 testpaths가 tests/ 전체를 잡으므로
      # 새 하위 폴더의 테스트가 조용히 빠지지 않는다.
      - name: Test (pytest)
        run: pytest

      # 운영 의존성(requirements.txt)만 감사한다. CI 도구의 취약점까지 섞으면
      # 배포 이미지와 무관한 이유로 게이트가 막힌다.
      #
      # 아래 --ignore-vuln은 starlette 0.46.2의 알려진 취약점이다. fastapi 0.115가
      # starlette<0.47을 요구하는데 수정본은 0.47.2부터라, FastAPI를 함께 올려야만
      # 해소된다(docs/backend/refactor/08-dependency-model-supply-chain.md에서 처리).
      # 여기에 나열된 것 외의 새 취약점은 그대로 CI를 실패시킨다.
      - name: Dependency audit (pip-audit)
        env:
          PYTHONUTF8: "1" # requirements.txt의 한글 주석을 UTF-8로 읽는다
        run: |
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

<!--
  "위치 지정" 버튼 아이콘 — 지도 위 한 점에 내 위치를 놓는다는 뜻.

  ## 색을 하나도 박아 두지 않는다

  버튼은 두 가지 상태로 이 아이콘을 그린다. 비활성은 흰 배경 + 파란 아이콘,
  활성은 파란 배경 + 흰 아이콘이다. 그래서 호출부가 `ColorFilter.srcIn`으로
  통째로 덮어씌운다 — 여기에 실제 색을 적어 두면 활성 상태에서 흰색으로 바뀌지
  않는다.

  대신 **알파로 두 톤을 만든다.** srcIn은 RGB만 갈아치우고 알파는 남기므로,
  fill-opacity 0.42인 몸통과 불투명한 외곽선이 어느 색으로 칠해지든 같은 농담
  차이를 유지한다. 색을 직접 적고 두 톤을 내려 하면 이 성질을 잃는다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- 바닥 타원과 눈금을 먼저 깔고 그 위에 핀을 얹는다. 핀 끝이 타원 안으로
       들어가 보여야 "이 지점에 놓는다"로 읽힌다. -->
  <ellipse cx="12" cy="18.3" rx="4.2" ry="2.3"
           stroke="#000000" stroke-width="1.5"/>
  <path d="M3.4 18.3h2.2M18.4 18.3h2.2M12 21.6v1.6"
        stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 몸통 채움. 가운데 원을 evenodd로 뚫어 구멍을 만든다. 흰색으로 덮어 그리면
       활성 상태(파란 배경)에서 그 부분만 흰 점으로 남는다. -->
  <path fill="#000000" fill-opacity="0.42" fill-rule="evenodd"
        d="M12 18.2C11 15.8 8.3 12.5 7.16 9.87A5.2 5.2 0 1 1 16.84 9.87C15.7 12.5 13 15.8 12 18.2Z
           M12 10.6A2.6 2.6 0 1 0 12 5.4A2.6 2.6 0 1 0 12 10.6Z"/>

  <path d="M12 18.2C11 15.8 8.3 12.5 7.16 9.87A5.2 5.2 0 1 1 16.84 9.87C15.7 12.5 13 15.8 12 18.2Z"
        stroke="#000000" stroke-width="1.7" stroke-linejoin="round"/>
  <circle cx="12" cy="8" r="2.6" stroke="#000000" stroke-width="1.7"/>
</svg>
